server.port: 9999

logging:
  level:
    org.springframework.cloud.gateway: TRACE
    reactor.netty.http.client: DEBUG

spring:
  application:
    name: gateway-ecommerce
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: http://auth.algashop.local:8081
  cloud:
    gateway:
      server:
        webflux:
          default-filters:
            - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST
            - Retry=3,INTERNAL_SERVER_ERROR,GET,10ms,50ms,2,false
            - name: Retry
              args:
                retries: 3
                statuses: BAD_GATEWAY, INTERNAL_SERVER_ERROR
                methods: GET,PUT
                exceptions: java.io.IOException, java.util.concurrent.TimeoutException
                backoff:
                  firstBackoff: 10ms
                  maxBackoff: 20ms
          httpclient:
            connect-timeout: 1000
            response-timeout: 5000
          globalcors:
            add-to-simple-url-handler-mapping: true
            cors-configurations:
              '[/**]':
                allowed-origins: http://admin.algashop.local:4200
                allowed-headers: '*'
                allowedMethods:
                  - GET
                  - POST
                  - PUT
                  - DELETE
                  - OPTIONS
          routes:
            - id: billing-route
              uri: lb://billing
              predicates:
                - Path=/api/v1/customers/me/orders/{orderId}/invoice,/api/v1/orders/{orderId}/invoice,/api/v1/customers/me/credit-cards,/api/v1/customers/me/credit-cards/{creditCardId}
                - Method=GET,POST,PUT,DELETE,OPTIONS
            - id: ordering-route
              uri: lb://ordering
              #              uri: http://localhost:8080 # It can be an internal network or the Internet
              predicates:
                - Path=/api/v1/orders/**,/api/v1/customers/**,/api/v1/shipping-cost-previews
                - Method=GET,POST,PUT,DELETE,OPTIONS
              filters:
#                - CircuitBreaker=ordering-route-cb
                - name: CircuitBreaker
                  args:
                    name: ordering-route-cb
                    statusCodes:
                      - 502
                      - 504
                      - 500
            - id: product-catalog-route
              uri: lb://product-catalog
              predicates:
                - Path=/api/v1/products/**,/api/v1/categories/**,/api/v1/upload-requests/**
                - Method=GET,POST,PUT,DELETE,OPTIONS
            - id: product-catalog-test-route
              uri: lb://product-catalog
              predicates:
                - Path=/products/**
              filters:
                - RewritePath=/products/?(?<segment>.*), /api/v1/products$\{segment}
                - AddResponseHeader=X-Path-rewrite-info, Path have been rewrite to /api/v1/products
              #                - name: RewritePath
              #                  args:
              #                    regexp: /products/?(?<segment>.*)
              #                    replacement: /api/v1/products$\{segment}
              metadata:
                response-timeout: 1000
                commect-timeout: 1000
            #                cors:
            #                  allowedOrigins: http://localhost:4200
            #                  allowedMethods:
            #                    - GET
            #                    - POST
            #                  allowedHeaders: '*'
            #                  maxAge: 30
            - id: user-management-route
              uri: lb://authorization-server
              predicates:
                - Path=/api/v1/users/**
                - Method=GET,POST,PUT,DELETE,OPTIONS


eureka:
  client:
    serviceUrl:
      defaultZone: http://algashop-service-registry:8761/eureka
    registerWithEureka: false
    fetchRegistry: true

management:
  endpoints:
    web:
      exposure:
        include: health, gateway, circuitbreakers
  endpoint:
    gateway:
      enabled: true

resilience4j.circuitbreaker:
  instances:
    ordering-route-cb:
      sliding-window-size: 8
      failure-rate-threshold: 50
      minimum-number-of-calls: 5
      permitted-number-of-calls-in-half-open-state: 5
      sliding-window-type: COUNT_BASED
      wait-duration-in-open-state: 10s
      max-wait-duration-in-half-open-state: 30s
      register-health-indicator: true